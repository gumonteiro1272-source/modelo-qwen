name: Baixar Modelo OpenVINO NPU-GPU

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-model:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar HuggingFace CLI
        run: pip install -U huggingface_hub

      - name: Baixar OpenVINO/Qwen2.5-Coder-3B-Instruct-int4-ov
        run: |
          python -c "from huggingface_hub import snapshot_download; snapshot_download('OpenVINO/Qwen2.5-Coder-3B-Instruct-int4-ov', local_dir='modelo_openvino')"

      - name: Compactar em ZIP único
        run: |
          cd modelo_openvino
          zip -r ../modelo_openvino_qwen3b.zip .

      - name: Publicar na Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: openvino-qwen3b-v1
          name: Modelo OpenVINO Qwen2.5-Coder-3B INT4
          files: modelo_openvino_qwen3b.zip
